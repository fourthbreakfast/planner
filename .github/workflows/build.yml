name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # the app carries its own Syncthing, built from third_party/syncthing with the Go version it asks for
      - name: syncthing names its version from its tags, which a checkout leaves out
        run: git -C ../third_party/syncthing fetch --tags --force origin
      - uses: actions/setup-go@v5
        with:
          go-version-file: third_party/syncthing/go.mod
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: style
        run: ./gradlew ktlintCheck --console=plain
      - name: a syncthing for the sync tests
        run: |
          cd ../third_party/syncthing
          go run build.go assets
          CGO_ENABLED=0 go build -tags noupgrade -ldflags=-checklinkname=0 -o "$RUNNER_TEMP/syncthing" ./cmd/syncthing
          echo "PLANNER_SYNCTHING=$RUNNER_TEMP/syncthing" >> "$GITHUB_ENV"
      - name: tests
        run: ./gradlew :core:test :sync:test :shared:desktopTest :desktop:test testDebugUnitTest --console=plain
      - name: app
        run: ./gradlew assembleDebug assembleRelease --console=plain
      - name: windows app
        run: ./gradlew :desktop:compileKotlin --console=plain
