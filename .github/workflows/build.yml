name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # the app carries its own Syncthing, built from third_party/syncthing with the Go version it asks for
      - uses: actions/setup-go@v5
        with:
          go-version-file: third_party/syncthing/go.mod
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: style
        run: ./gradlew ktlintCheck --console=plain
      - name: tests
        run: ./gradlew :core:test :sync:test :shared:desktopTest testDebugUnitTest --console=plain
      - name: app
        run: ./gradlew assembleDebug --console=plain
      - name: windows app
        run: ./gradlew :desktop:compileKotlin --console=plain
