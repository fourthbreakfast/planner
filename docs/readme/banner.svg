<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="planner: tasks, agenda and notes">
  <style>
    .word { font: 700 76px system-ui, sans-serif; fill: #182735; letter-spacing: -3px; }
    .caption { font: 400 19px system-ui, sans-serif; fill: #596b7b; }
    .accent { stroke: #176b5b; }
    .ring { fill: none; stroke: #596b7b; stroke-width: 3; }
    @media (prefers-color-scheme: dark) {
      .word { fill: #e6eef5; }
      .caption { fill: #a2b3c3; }
      .accent { stroke: #83d5bf; }
      .ring { stroke: #a2b3c3; }
    }
  </style>
  <text class="word" x="8" y="90">planner</text>
  <text class="caption" x="12" y="128">tasks · agenda · notes</text>
  <path class="accent" d="M12 146h72" stroke-width="4" stroke-linecap="round"/>
  <circle cx="728" cy="76" r="12" fill="#c4444c"/>
  <circle cx="772" cy="76" r="10" fill="#af790d"/>
  <circle cx="816" cy="76" r="8" fill="#477ea8"/>
  <circle cx="860" cy="76" r="8.5" class="ring"/>
</svg>
