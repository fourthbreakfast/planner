<!-- @dsCard group="Tasks" height=380 subtitle="a task with its dot, title, count and check" -->
<style>
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/24px var(--font-sans); }
  .row { display: flex; align-items: center; min-height: var(--touch); padding: 0 var(--space-1); }
  .row.aim { background: var(--aim); }
  .lane { width: var(--dot-lane); height: var(--touch); display: flex; align-items: center; justify-content: center; flex: none; }
  .dot { width: var(--dot); height: var(--dot); border-radius: 50%; }
  .dot.high { width: var(--dot-high); height: var(--dot-high); }
  .dot.medium { width: var(--dot-medium); height: var(--dot-medium); }
  .dot.low { width: var(--dot-low); height: var(--dot-low); }
  .dot.none { box-sizing: border-box; border: 1.5px solid var(--quiet); }
  .title { flex: 1; min-width: 0; padding: var(--space-3) 0; }
  .done .title { text-decoration: line-through; color: var(--quiet); }
  .count { font: 500 12px/16px var(--font-mono); color: var(--quiet); padding-right: var(--space-1); }
  .check { width: var(--touch); height: var(--touch); display: flex; align-items: center; justify-content: center; flex: none; }
  .box { box-sizing: border-box; width: var(--check); height: var(--check); border: 1.5px solid var(--ink); }
  .box.on { background: var(--ink); position: relative; }
  .box.on::after { content: ""; position: absolute; left: 3px; top: 1px; width: 3px; height: 7px; border: solid var(--page); border-width: 0 2px 2px 0; transform: rotate(40deg); }
</style>
<div id="root"></div>
<script>
  const rows = [
    { t: 'tarjeta embarque', p: 'high', d: 0 },
    { t: 'clean room', p: 'medium', d: 0, count: '1/2' },
    { t: 'wash the sheets', p: 'low', d: 1, aim: true },
    { t: 'bring a towel', p: 'none', d: 2 },
    { t: 'prep tfm', p: 'none', d: 0, done: true },
  ];
  document.getElementById('root').innerHTML = rows.map(r => `
    <div class="row${r.aim ? ' aim' : ''}${r.done ? ' done' : ''}">
      <div style="width:calc(var(--indent) * ${r.d}); flex:none"></div>
      <div class="lane"><span class="dot ${r.p}" style="${r.p === 'none' ? '' : 'background:var(--priority-' + r.p + ')'}"></span></div>
      <div class="title">${r.t}</div>
      ${r.count ? `<div class="count">${r.count}</div>` : ''}
      <div class="check"><span class="box${r.done ? ' on' : ''}"></span></div>
    </div>`).join('');
</script>
