<!-- @dsCard group="Gestures" height=240 subtitle="swipe right removes, swipe left renames" -->
<style>
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/24px var(--font-sans); }
  .cap { font: 500 12px/16px var(--font-mono); color: var(--quiet); padding: 12px var(--gutter) 4px; }
  .swipe { position: relative; height: var(--touch); overflow: hidden; }
  .under { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 var(--gutter); font: 500 14px/20px var(--font-sans); }
  .remove { background: var(--error); color: var(--on-accent); justify-content: flex-start; }
  .rename { background: var(--aim); color: var(--ink); justify-content: flex-end; }
  .top { position: absolute; inset: 0; background: var(--page); display: flex; align-items: center; padding-left: 56px; box-sizing: border-box; }
</style>
<div class="cap">row pulled to the right</div>
<div class="swipe"><div class="under remove">move to bin</div><div class="top" style="left: 40%">clean room</div></div>
<div class="cap">row pulled to the left</div>
<div class="swipe"><div class="under rename">rename</div><div class="top" style="left: -40%; padding-left: calc(40% + 56px)">clean room</div></div>
