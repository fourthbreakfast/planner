<!-- @dsCard group="Agenda" height=420 subtitle="a day heading, then its events with everything on view" -->
<style>
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/24px var(--font-sans); }
  .day { font: 500 12px/16px var(--font-mono); color: var(--quiet); padding: var(--space-4) var(--gutter) var(--space-1); }
  .day.big { padding-top: var(--space-6); opacity: 0.7; }
  .event { display: flex; min-height: var(--touch); padding: var(--space-3) var(--gutter); box-sizing: border-box; }
  .time { width: var(--time-column); flex: none; font: 500 16px/24px var(--font-mono); color: var(--ink); }
  .time.all { font: 500 12px/24px var(--font-mono); color: var(--quiet); }
  .body { flex: 1; min-width: 0; }
  .title { color: var(--ink); }
  .more { font: 14px/20px var(--font-sans); color: var(--quiet); }
  .past .title, .past .time { color: var(--quiet); }
</style>
<div class="day">today · sat 31 oct</div>
<div class="event"><div class="time all">all day</div><div class="body"><div class="title">dentist</div><div class="more">clinic on main street</div><div class="more">bring the insurance card</div></div></div>
<div class="event"><div class="time">09:00</div><div class="body"><div class="title">team lunch</div></div></div>
<div class="day">tomorrow · sun 1 nov</div>
<div class="event"><div class="time">19:30</div><div class="body"><div class="title">cinema</div><div class="more">the old one near the river</div></div></div>
<div class="day big">earlier</div>
<div class="day big" style="padding-top: var(--space-1)">yesterday · fri 30 oct</div>
<div class="event past"><div class="time">12:00</div><div class="body"><div class="title">call grandma</div></div></div>
