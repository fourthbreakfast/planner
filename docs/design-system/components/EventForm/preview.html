<style>

  .top { display: flex; align-items: center; padding: 0 var(--row-pad) 0 var(--gutter); min-height: var(--touch); }
  .top .word { flex: 1; font: 500 22px/28px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
  .top span { color: var(--quiet); font: 20px/1 var(--font-mono); width: var(--touch); text-align: center; }
  .label { font: 500 12px/16px var(--font-mono); color: var(--quiet); padding: var(--space-4) var(--gutter) 0; }
  .value { min-height: var(--touch); display: flex; align-items: center; padding: 0 var(--gutter); }
  .save { margin: var(--space-4) var(--gutter); min-height: var(--touch); display: flex; align-items: center; justify-content: center; background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--radius-check); font: 500 16px/24px var(--font-mono); box-sizing: border-box; }
</style>
