<!-- @dsCard group="Agenda" height=640 subtitle="empty lines to write on, a time that is all day, a start or a start and end" -->
<style>
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/24px var(--font-sans); }
  .top { display: flex; align-items: center; padding: 0 var(--row-pad) 0 var(--gutter); }
  .top h1 { flex: 1; margin: 0; padding: var(--space-2) 0; font: 500 22px/28px var(--font-mono); }
  .top span { color: var(--quiet); font: 20px/1 var(--font-mono); width: var(--touch); text-align: center; }
  .label { font: 500 12px/16px var(--font-mono); color: var(--quiet); padding: var(--space-4) var(--gutter) 0; }
  .line { min-height: var(--touch); display: flex; align-items: center; padding: 0 var(--gutter); }
  .rule { height: 0; border-bottom: 1.5px solid var(--line); margin: 0 var(--gutter); }
  .save { text-align: center; padding: var(--space-3); font: 500 14px/20px var(--font-sans); }
  .panel { margin: var(--space-4); padding: var(--space-4); background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--radius-check); }
  .modes { display: flex; justify-content: space-between; font: 500 14px/20px var(--font-sans); color: var(--quiet); }
  .modes b { color: var(--ink); font-weight: 500; }
  .big { font: 500 22px/28px var(--font-mono); margin-top: var(--space-2); }
  .big span { color: var(--quiet); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); }
  .cell { height: calc(var(--touch) - var(--space-2)); margin: 4px; border-radius: var(--radius-check); background: var(--panel); color: var(--quiet); display: flex; align-items: center; justify-content: center; font: 500 16px/24px var(--font-mono); }
  .cell.on { background: var(--ink); color: var(--page); }
  .cap { font: 500 12px/16px var(--font-mono); color: var(--quiet); margin-top: var(--space-3); }
</style>
<div class="top"><h1>event</h1><span>←</span></div>
<div class="label">name</div><div class="line">dentist</div><div class="rule"></div>
<div class="label">day</div><div class="line">sat 31 oct</div><div class="rule"></div>
<div class="label">time</div><div class="line">09:00 – 10:30</div><div class="rule"></div>
<div class="label">location</div><div class="line"></div><div class="rule"></div>
<div class="label">notes</div><div class="line"></div><div class="rule"></div>
<div class="save">save</div>
<div class="panel">
  <div class="modes"><span>all day</span><span>start</span><b>start – end</b></div>
  <div class="big">09:00 <span>– 10:30</span></div>
  <div class="cap">hour</div>
  <div class="grid"><div class="cell">06</div><div class="cell">07</div><div class="cell">08</div><div class="cell on">09</div><div class="cell">10</div><div class="cell">11</div></div>
  <div class="cap">minute</div>
  <div class="grid"><div class="cell on">00</div><div class="cell">05</div><div class="cell">10</div><div class="cell">15</div><div class="cell">20</div><div class="cell">25</div></div>
</div>
