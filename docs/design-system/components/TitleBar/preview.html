<!-- @dsCard group="Header" height=180 subtitle="readable title and quiet count" -->
<style>
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/20px var(--font-sans); }
  .bar { display: flex; align-items: center; min-height: var(--touch); padding: var(--space-2) var(--gutter); }
  h1 { margin: 0; font: 700 22px/28px var(--font-sans); }
  .count { margin-left: var(--space-3); font: 500 12px/16px var(--font-mono); color: var(--quiet); }
  .actions { margin-left: auto; display: flex; }
  button { border: 0; background: none; color: var(--quiet); min-width: var(--touch); min-height: var(--touch); font: inherit; }
</style>
<header class="bar"><h1>tasks</h1><span class="count" aria-label="4 open tasks">4</span><div class="actions"><button aria-label="open bin">bin</button></div></header>
<header class="bar"><h1>notes</h1><span class="count" aria-label="3 notes">3</span><div class="actions"><button>search</button><button aria-label="open notes bin">bin</button></div></header>
