<!-- @dsCard group="Tasks" height=130 subtitle="unchecked and checked" -->
<style>
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/20px var(--font-sans); }
  .wrap { display: flex; gap: 40px; padding: 24px var(--gutter); }
  .item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .touch { width: var(--touch); height: var(--touch); display: flex; align-items: center; justify-content: center; }
  .box { box-sizing: border-box; width: var(--check); height: var(--check); border: 1.5px solid var(--ink); position: relative; }
  .on { background: var(--ink); }
  .on::after { content: ""; position: absolute; left: 3px; top: 1px; width: 3px; height: 7px; border: solid var(--page); border-width: 0 2px 2px 0; transform: rotate(40deg); }
  .name { font: 500 12px/16px var(--font-mono); color: var(--quiet); }
</style>
<div class="wrap">
  <div class="item"><div class="touch"><span class="box"></span></div><span class="name">open</span></div>
  <div class="item"><div class="touch"><span class="box on"></span></div><span class="name">done</span></div>
</div>
