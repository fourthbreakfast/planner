<!-- @dsCard group="Header" height=130 subtitle="a triangle pointing down opens everything, pointing up closes it" -->
<style>
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/20px var(--font-sans); }
  .wrap { display: flex; gap: 40px; padding: 24px var(--gutter); }
  .item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .touch { width: var(--touch); height: var(--touch); display: flex; align-items: center; justify-content: center; color: var(--quiet); }
  svg { width: var(--icon); height: var(--icon); fill: currentColor; }
  .name { font: 500 12px/16px var(--font-mono); color: var(--quiet); }
</style>
<div class="wrap">
  <div class="item"><div class="touch"><svg viewBox="0 0 20 20"><path d="M4.8 7.2 L15.2 7.2 L10 13.2 Z"/></svg></div><span class="name">open all</span></div>
  <div class="item"><div class="touch"><svg viewBox="0 0 20 20"><path d="M4.8 12.8 L15.2 12.8 L10 6.8 Z"/></svg></div><span class="name">close all</span></div>
</div>
