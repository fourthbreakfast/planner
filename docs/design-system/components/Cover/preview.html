<!-- @dsCard height=288 -->
<style>
  html, body { margin: 0; background: var(--page); }
  svg { display: block; width: 960px; height: 288px; }
  .ink { fill: var(--ink); }
  .high { fill: var(--priority-high); }
  .medium { fill: var(--priority-medium); }
  .low { fill: var(--priority-low); }
  .aim { fill: var(--aim); }
  .panel { fill: var(--panel); }
  .cut { fill: var(--page); }
  .tile { rx: var(--radius-check); }
  .name { font: 500 96px/1 var(--font-mono); fill: var(--ink); letter-spacing: 0; }
  .tag { font: 500 14px/20px var(--font-mono); fill: var(--quiet); }
</style>
<svg viewBox="0 0 960 288" role="img" aria-label="planner">
  <!--
    blocks: ink 288x192, priority-high/medium/low 96x96 each, panel 96x192, aim 192x96; the touch step (48) is the unit
    arrangement: one tall ink slab with the three priority hues stacked as satellites at its right edge, bleeding off the top and right
    pattern: a dot grid at one step (a technical, console-like list on a 48px grid), cut out of the ink slab in the ground color
    steps and radii: 48 and 96, radius-check on every tile
  -->
  <rect class="ink tile" x="480" y="0" width="288" height="192"/>
  <rect class="high tile" x="768" y="0" width="96" height="96"/>
  <rect class="medium tile" x="864" y="0" width="96" height="96"/>
  <rect class="low tile" x="768" y="96" width="96" height="96"/>
  <rect class="panel tile" x="864" y="96" width="96" height="192"/>
  <rect class="aim tile" x="480" y="192" width="192" height="96"/>
  <g class="cut">
    <circle cx="528" cy="48" r="3"/><circle cx="576" cy="48" r="3"/><circle cx="624" cy="48" r="3"/><circle cx="672" cy="48" r="3"/><circle cx="720" cy="48" r="3"/>
    <circle cx="528" cy="96" r="3"/><circle cx="576" cy="96" r="3"/><circle cx="624" cy="96" r="3"/><circle cx="672" cy="96" r="3"/><circle cx="720" cy="96" r="3"/>
    <circle cx="528" cy="144" r="3"/><circle cx="576" cy="144" r="3"/><circle cx="624" cy="144" r="3"/><circle cx="672" cy="144" r="3"/><circle cx="720" cy="144" r="3"/>
  </g>
  <text class="name" x="24" y="212">planner</text>
  <text class="tag" x="26" y="250">a task list that stays out of the way</text>
</svg>
