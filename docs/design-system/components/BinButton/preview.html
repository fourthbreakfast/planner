<!-- @dsCard group="Header" height=130 subtitle="the bin, with and without a count" -->
<style>
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/20px var(--font-sans); }
  .wrap { display: flex; gap: 40px; padding: 24px var(--gutter); }
  .btn { display: flex; align-items: center; justify-content: center; min-width: var(--touch); height: var(--touch); color: var(--quiet); }
  .btn span { font: 500 12px/16px var(--font-mono); margin-left: var(--space-1); }
  svg { width: var(--icon); height: var(--icon); fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
</style>
<template id="bin"><svg viewBox="0 0 20 20"><path d="M4.4 5.6 L5.6 18.4 L14.4 18.4 L15.6 5.6"/><path d="M2.4 5.6 L17.6 5.6 M7.6 5.6 L7.6 2 L12.4 2 L12.4 5.6"/></svg></template>
<div class="wrap" id="root"></div>
<script>
  const tpl = document.getElementById('bin').innerHTML;
  document.getElementById('root').innerHTML = `<div class="btn">${tpl}</div><div class="btn">${tpl}<span>12</span></div>`;
</script>
