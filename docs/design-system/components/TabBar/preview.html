<!-- @dsCard group="Header" height=260 subtitle="tasks at the left, agenda at the right" -->
<style>
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/24px var(--font-sans); }
  .tabs { display: flex; padding: 0 var(--row-pad); }
  .tab { flex: 1; min-height: var(--touch); display: flex; align-items: center; padding: 0 calc(var(--gutter) - var(--row-pad)); font: 500 22px/28px var(--font-mono); }
  .tab.right { justify-content: flex-end; }
  .on { color: var(--ink); }
  .off { color: var(--quiet); opacity: 0.7; }
  .cap { font: 500 12px/16px var(--font-mono); color: var(--quiet); padding: 16px var(--gutter) 0; }
</style>
<div class="cap">on tasks</div>
<div class="tabs"><div class="tab on">tasks</div><div class="tab right off">agenda</div></div>
<div class="cap">on agenda</div>
<div class="tabs"><div class="tab off">tasks</div><div class="tab right on">agenda</div></div>
