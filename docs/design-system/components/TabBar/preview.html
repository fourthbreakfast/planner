<!-- @dsCard group="Header" height=260 subtitle="tasks, agenda and notes along the top" -->
<style>
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/24px var(--font-sans); }
  .tabs { display: flex; padding: 0 var(--row-pad); }
  .tab { flex: 1; min-height: var(--touch); display: flex; align-items: center; justify-content: center; position: relative; font: 500 14px/20px var(--font-sans); }
  .on { color: var(--accent); }
  .on::after { content: ""; position: absolute; bottom: 0; left: calc(50% - 12px); width: 24px; height: 2px; background: var(--accent); }
  .off { color: var(--quiet); }
  .cap { font: 500 12px/16px var(--font-mono); color: var(--quiet); padding: 16px var(--gutter) 0; }
</style>
<div class="cap">on tasks</div>
<div class="tabs"><div class="tab on">tasks</div><div class="tab off" style="text-align:center">agenda</div><div class="tab right off">notes</div></div>
<div class="cap">on agenda</div>
<div class="tabs"><div class="tab off">tasks</div><div class="tab on" style="text-align:center">agenda</div><div class="tab right off">notes</div></div>
