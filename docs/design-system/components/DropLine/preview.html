<!-- @dsCard group="Dragging" height=420 subtitle="where a dragged task would land" -->
<style>
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/24px var(--font-sans); }
  .cap { font: 500 12px/16px var(--font-mono); color: var(--quiet); padding: 12px var(--gutter) 2px; }
  .row { position: relative; display: flex; align-items: center; height: var(--touch); padding: 0 var(--space-1); }
  .row.into { background: var(--aim); }
  .lane { width: var(--dot-lane); display: flex; justify-content: center; flex: none; }
  .dot { width: var(--dot); height: var(--dot); border-radius: 50%; box-sizing: border-box; border: 1.5px solid var(--quiet); }
  .line { position: absolute; right: 0; bottom: 0; height: 2px; background: var(--ink); }
  .lift { background: var(--aim); box-shadow: var(--lift); opacity: 0.92; }
</style>
<div class="cap">below the last subtask, finger straight down: stays inside the parent</div>
<div class="row"><div class="lane"><span class="dot"></span></div>clean room</div>
<div class="row"><div style="width:var(--indent)"></div><div class="lane"><span class="dot"></span></div>wash the sheets<span class="line" style="left: calc(var(--space-1) + var(--indent))"></span></div>
<div class="cap">finger moved left: out of the parent, right after it</div>
<div class="row"><div class="lane"><span class="dot"></span></div>clean room</div>
<div class="row"><div style="width:var(--indent)"></div><div class="lane"><span class="dot"></span></div>wash the sheets<span class="line" style="left: var(--space-1)"></span></div>
<div class="cap">on the middle of a row: nest inside it</div>
<div class="row into"><div class="lane"><span class="dot"></span></div>prep tfm</div>
<div class="cap">the row being dragged</div>
<div class="row lift"><div class="lane"><span class="dot"></span></div>circulo calendar</div>
